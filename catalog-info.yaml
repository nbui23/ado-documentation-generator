apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-engineering
  description: Owns the internal developer platform and EDGAR.
spec:
  type: team
  profile:
    displayName: Platform Engineering
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: developer-experience
  description: Internal developer experience and software documentation platform.
spec:
  owner: group:default/platform-engineering
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: edgar-postgres
  description: PostgreSQL 18 and pgvector durable evidence store for EDGAR.
spec:
  type: database
  owner: group:default/platform-engineering
  system: developer-experience
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: edgar
  title: EDGAR
  description: Evidence-Driven Generation for Azure Repositories.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - azure-devops
    - atlassian
    - jira
    - documentation
    - typescript
    - azure-openai
    - postgres
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-engineering
  system: developer-experience
  dependsOn:
    - resource:default/edgar-postgres
