services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edgar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edgar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-edgar} -d $${POSTGRES_DB:-edgar}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  edgar-postgres:
