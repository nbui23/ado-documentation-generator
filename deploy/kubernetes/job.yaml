apiVersion: batch/v1
kind: Job
metadata:
  name: agent-docs
  labels:
    app.kubernetes.io/name: agent-docs
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-docs
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: agent-docs
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: REPLACE_WITH_PINNED_AGENT_DOCS_IMAGE
          args: ["db", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-docs-database
                  key: migrationDatabaseUrl
            - name: DATABASE_REQUIRE_TLS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: agent-docs
          image: REPLACE_WITH_PINNED_AGENT_DOCS_IMAGE
          args: ["run"]
          workingDir: /workspace
          env:
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-docs-database
                  key: runtimeDatabaseUrl
            - name: DATABASE_REQUIRE_TLS
              value: "true"
          envFrom:
            - secretRef:
                name: agent-docs-identity
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /workspace/.agent-docs.yaml
              subPath: .agent-docs.yaml
              readOnly: true
            - name: generated-docs
              mountPath: /workspace/generated-docs
      volumes:
        - name: config
          configMap:
            name: agent-docs
        - name: generated-docs
          emptyDir: {}
